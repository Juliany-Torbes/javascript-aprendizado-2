<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachorro aleatório</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="topo">
        <h1>Cachorro aleatório</h1>
        <button type="button" class="botao-tema">Tema escuro</button>
    </header>

    <main class="cartao">
        <p>
            <label for="raca">Raça</label>
            <select id="raca" class="campo-raca">
                <option value="">Qualquer raça</option>
                <option value="beagle">Beagle</option>
                <option value="husky">Husky</option>
                <option value="labrador">Labrador</option>
                <option value="pug">Pug</option>
                <option value="poodle">Poodle</option>
                <option value="caramelo">Vira-lata caramelo</option>
            </select>
        </p>

        <button type="button" class="botao-buscar">Outro cachorro</button>

        <p class="status" aria-live="polite">Clique no botão para ver um cachorro.</p>

        <img class="foto" src="" alt="">
    </main>

</body>

</html>
